<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            line-height: 1.6;
        }

        nav {
            display: flex;
            justify-content: space-between;

        }

        nav h2 {
            color: #38bdf8;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .hero {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #38bdf8;
        }

        .hero p {
            max-width: 600px;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            background: #38bdf8;
            color: #0f172a;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }

        <p>
            This is my own website, built from scratch.
            I'm learning, creating, and bringing my ideas to life
            on the internet.
        </p>

        <a href="https://github.com/" class="button">
            Explore GitHub
        </a>
    </main>

    <footer>
        <p>&copy; 2026 MyWebsite. Built with creativity.</p>
    </footer>

</body>
</html>
